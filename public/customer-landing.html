<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Hub — Bluecopa</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;background:#060606;color:#fff;overflow:hidden;
  font-family:'DM Sans',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}

/* ── Header ── */
.hdr{
  position:fixed;top:0;left:0;right:0;z-index:50;
  height:64px;display:flex;align-items:center;padding:0 48px;
  background:rgba(6,6,6,.85);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.05);
}
.hdr-logo{
  display:flex;align-items:center;gap:11px;
  font-family:'Outfit',sans-serif;font-size:17px;font-weight:800;color:#fff;
}
.logo-mark{
  width:34px;height:34px;background:linear-gradient(135deg,#3B6EFA,#7b9ffd);
  border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:900;color:#fff;
  box-shadow:0 4px 16px rgba(59,110,250,.45);
}
.hdr-right{
  margin-left:auto;display:flex;align-items:center;gap:24px;
}
.hdr-label{
  font-size:11px;font-weight:600;letter-spacing:1.2px;
  color:rgba(255,255,255,.22);
}

/* ── Hero ── */
.hero{
  height:100vh;padding-top:64px;
  display:grid;grid-template-columns:1fr 1fr;
}

/* Left */
.hero-left{
  display:flex;flex-direction:column;justify-content:center;
  padding:0 56px 0 56px;
  position:relative;z-index:1;
}
.eyebrow{
  display:flex;align-items:center;gap:9px;
  margin-bottom:28px;
}
.eyebrow-dot{
  width:8px;height:8px;border-radius:50%;
  background:#3B6EFA;
  box-shadow:0 0 10px rgba(59,110,250,.9);
  animation:bdot 2s ease-in-out infinite;flex-shrink:0;
}
@keyframes bdot{
  0%,100%{box-shadow:0 0 8px rgba(59,110,250,.8)}
  50%{box-shadow:0 0 18px rgba(59,110,250,1),0 0 32px rgba(59,110,250,.3)}
}
.eyebrow-text{
  font-size:11px;font-weight:700;letter-spacing:1.3px;
  text-transform:uppercase;color:rgba(255,255,255,.35);
}
.client-name{
  font-family:'Outfit',sans-serif;
  font-size:clamp(48px,6.5vw,100px);
  font-weight:900;line-height:1;letter-spacing:-.04em;
  color:#fff;margin-bottom:0;
  animation:slideIn .75s cubic-bezier(.22,1,.36,1) both;
}
@keyframes slideIn{
  from{opacity:0;transform:translateX(-24px)}
  to{opacity:1;transform:translateX(0)}
}
.name-period{color:rgba(59,110,250,.9)}

.hero-sub{
  font-size:15px;font-weight:400;color:rgba(255,255,255,.38);
  line-height:1.75;max-width:360px;margin-top:22px;margin-bottom:48px;
  animation:slideIn .75s .18s cubic-bezier(.22,1,.36,1) both;
}
.cta-wrap{
  display:flex;align-items:center;gap:20px;
  animation:slideIn .75s .34s cubic-bezier(.22,1,.36,1) both;
}
.cta-btn{
  display:inline-flex;align-items:center;gap:10px;
  background:#3B6EFA;color:#fff;border:none;
  border-radius:99px;padding:15px 34px;
  font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;
  cursor:pointer;letter-spacing:-.1px;
  box-shadow:0 8px 28px rgba(59,110,250,.42);
  position:relative;overflow:hidden;
  transition:transform .18s,box-shadow .18s;
}
.cta-btn::after{
  content:'';position:absolute;top:0;left:-100%;bottom:0;width:55%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);
  transition:left .42s;
}
.cta-btn:hover::after{left:150%}
.cta-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 14px 40px rgba(59,110,250,.6);
}
.cta-btn:active{transform:translateY(-1px)}
.arrow{transition:transform .18s;display:flex}
.cta-btn:hover .arrow{transform:translateX(5px)}

.scroll-hint{
  font-size:12px;color:rgba(255,255,255,.2);font-weight:500;
}

/* Right — canvas */
.hero-right{
  position:relative;overflow:hidden;
}
#viz{position:absolute;inset:0;width:100%;height:100%}

/* subtle left edge fade */
.hero-right::before{
  content:'';
  position:absolute;left:0;top:0;bottom:0;width:80px;z-index:1;
  background:linear-gradient(90deg,#060606,transparent);
  pointer-events:none;
}

/* ── Footer ── */
.footer{
  position:fixed;bottom:18px;left:0;right:0;text-align:center;z-index:50;
  font-size:11px;color:rgba(255,255,255,.12);letter-spacing:.3px;pointer-events:none;
}

/* ── Responsive ── */
@media(max-width:820px){
  .hero{grid-template-columns:1fr;grid-template-rows:1fr 45vw;overflow-y:auto}
  .hero-left{padding:44px 28px 28px;justify-content:flex-end}
  .hero-right{position:relative;height:45vw}
  .hdr{padding:0 24px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<!-- Header -->
<div class="hdr">
  <div class="hdr-logo">
    <div class="logo-mark">B</div>
    Bluecopa
  </div>
  <div class="hdr-right">
    <div class="hdr-label">CUSTOMER SUCCESS</div>
  </div>
</div>

<!-- Hero -->
<div class="hero">

  <!-- Left: text -->
  <div class="hero-left">
    <div class="eyebrow">
      <span class="eyebrow-dot"></span>
      <span class="eyebrow-text">Customer Hub</span>
    </div>
    <div class="client-name" id="clientName">—<span class="name-period">.</span></div>
    <div class="hero-sub" id="heroSub">Your implementation progress, milestones, and readiness — all in one place.</div>
    <div class="cta-wrap" id="ctaWrap">
      <button class="cta-btn" onclick="openHub()">
        Open Your Hub
        <span class="arrow">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
          </svg>
        </span>
      </button>
    </div>
  </div>

  <!-- Right: canvas -->
  <div class="hero-right">
    <canvas id="viz"></canvas>
  </div>

</div>

<div class="footer">Powered by Bluecopa</div>

<script>
// ── Contour blob animation ─────────────────────────────────────────────────────
const cvs = document.getElementById('viz');
const ctx = cvs.getContext('2d');
let W, H, cx, cy, maxR, t = 0;

function resize() {
  W = cvs.width  = cvs.offsetWidth;
  H = cvs.height = cvs.offsetHeight;
  cx = W / 2;
  cy = H / 2;
  maxR = Math.min(W, H) * 0.44;
}

// Organic blob radius at a given angle
function blobR(angle, time, r) {
  return r * (
    1
    + 0.26 * Math.sin(2 * angle + time * 0.32)
    + 0.17 * Math.sin(3 * angle - time * 0.25)
    + 0.11 * Math.sin(5 * angle + time * 0.50)
    + 0.07 * Math.sin(7 * angle - time * 0.17)
    + 0.04 * Math.sin(11 * angle + time * 0.38)
  );
}

function lerp3(a, b, f) {
  return [
    a[0] + (b[0]-a[0])*f | 0,
    a[1] + (b[1]-a[1])*f | 0,
    a[2] + (b[2]-a[2])*f | 0
  ];
}

const BLUE   = [59,  110, 250];
const PURPLE = [110,  65, 255];
const VIOLET = [190,  48, 240];

const N_CONTOURS = 36;
const N_PTS      = 220;

// Two blob centers offset from canvas center
const BLOBS = [
  { dx: -0.12, dy: -0.20, scale: 1.00, tOff: 0.0 },
  { dx:  0.18, dy:  0.24, scale: 0.78, tOff: 1.6 },
];

function draw() {
  ctx.clearRect(0, 0, W, H);

  BLOBS.forEach(({ dx, dy, scale, tOff }) => {
    const bx = cx + dx * maxR;
    const by = cy + dy * maxR;

    for (let c = 0; c < N_CONTOURS; c++) {
      const prog = c / (N_CONTOURS - 1);          // 0=outermost, 1=innermost
      const r    = maxR * scale * (0.18 + 0.82 * (1 - prog));
      const time = t + tOff;

      // Color: outer=blue, mid=purple, inner=violet
      const col = prog < 0.5
        ? lerp3(BLUE, PURPLE, prog * 2)
        : lerp3(PURPLE, VIOLET, (prog - 0.5) * 2);

      const alpha = 0.12 + 0.50 * prog;
      const lw    = 0.55 + 0.55 * prog;

      ctx.beginPath();
      for (let i = 0; i <= N_PTS; i++) {
        const angle = (i / N_PTS) * Math.PI * 2;
        const dist  = blobR(angle, time, r);
        const x = bx + dist * Math.cos(angle);
        const y = by + dist * Math.sin(angle);
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${alpha})`;
      ctx.lineWidth   = lw;
      ctx.stroke();
    }
  });

  t += 0.007;
  requestAnimationFrame(draw);
}

window.addEventListener('resize', resize);
resize();
draw();

// ── Token & localStorage ───────────────────────────────────────────────────────
const TOKEN      = location.pathname.split('/').filter(Boolean).pop();
const STORE_KEY  = 'bc_hub_' + TOKEN;

// Returning visitors skip straight to hub
if (localStorage.getItem(STORE_KEY)) {
  location.replace(location.pathname + '?hub=1');
}

function openHub() {
  localStorage.setItem(STORE_KEY, '1');
  document.querySelector('.cta-btn').style.transform = 'scale(.95)';
  setTimeout(() => { location.href = location.pathname + '?hub=1'; }, 160);
}

// ── Fetch client name ─────────────────────────────────────────────────────────
(async () => {
  const nameEl = document.getElementById('clientName');
  const subEl  = document.getElementById('heroSub');
  const ctaEl  = document.getElementById('ctaWrap');
  // Update name from API when ready
  try {
    const r = await fetch('/api/portal/' + TOKEN);
    const d = await r.json();
    if (d.ok && d.data && d.data.client) {
      const name = d.data.client.name || 'Welcome';
      nameEl.innerHTML = name + '<span class="name-period">.</span>';
      document.title = name + ' — Customer Hub';
    }
  } catch {}
})();
</script>
</body>
</html>
